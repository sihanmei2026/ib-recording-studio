<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recording Studio — Device Test</title><style>body{font:16px system-ui;background:#f1f5f9;color:#18304a;margin:0}main{max-width:760px;margin:30px auto;padding:24px;background:white;border-radius:16px}video{width:100%;max-height:380px;background:#172331;border-radius:12px}button,select{font:inherit;padding:10px 15px;margin:5px;border:1px solid #b7c9dc;border-radius:8px;background:white;color:inherit}button:disabled{opacity:.45}#start{background:#2869a0;color:white}#clock{font-size:38px;text-align:center;font-variant-numeric:tabular-nums}#status{white-space:pre-wrap}audio{width:100%}label{display:inline-block;margin:8px}progress{width:100%;height:18px}button{cursor:pointer}button:disabled{cursor:default}</style><main><h1>Oral Recording Studio</h1><p>Recording Studio v4 · Audio & transcript / 录音与转录</p><label>Mode / 模式 <select id="mode"><option value="video">Video / 录像</option><option value="audio" selected>Audio / 录音</option></select></label><label>Preparation / 准备 <select id="delay"><option>0</option><option>5</option><option selected>10</option><option>15</option><option>30</option></select> s</label><div><label><input type="checkbox" id="transcribe"> Live transcription / 实时转录（可选）</label><select id="lang"><option value="en-AU">English (Australia)</option><option value="zh-CN">Mandarin 中文</option></select><p style="font-size:13px">Speech recognition may send audio to your browser provider. / 语音识别可能将声音发送至浏览器服务商。</p></div><button id="preview">Enable devices / 开启设备</button><video id="live" hidden autoplay muted playsinline></video><div id="clock">00:00</div><button id="start" disabled>Start / 开始</button><button id="stop" disabled>Stop / 停止</button><button id="release">Release devices / 关闭设备</button><p id="status" role="status">Choose a mode and enable devices.</p><section id="transcriptPanel"><h2>Transcript / 转录</h2><p id="speechStatus" role="status">Optional / 可选</p><textarea id="transcript" rows="7" style="width:100%;box-sizing:border-box;font:inherit" placeholder="Transcript or manual notes / 转录文字或手动笔记"></textarea><p id="interim"></p><button id="copyText">Copy transcript / 复制</button><button id="saveText">Download transcript / 下载文字</button><button id="cloudText">Save transcript to Drive / 保存文字到云端</button><p id="textStatus" role="status"></p></section><section id="result" hidden><h2>Review / 回放</h2><video id="playvideo" controls hidden></video><audio id="playaudio" controls hidden></audio><p id="size"></p><button id="save">Save file / 保存文件</button><button id="cloud">Save to Google Drive / 保存到云端</button><progress id="progress" max="100" value="0" hidden></progress><p id="cloudstatus" role="status"></p><a id="driveLink" hidden target="_blank" rel="noopener noreferrer">Open in Drive / 打开云端文件</a><button id="again">Record again / 重新录制</button><button id="discard">Discard / 丢弃</button></section></main><script>
const $=id=>document.getElementById(id);let cloudDone=false,textUploading=false;let stream,rec,blob,url,timer,started,parts=[],busy=false,recordMode,saved=false,opening=false,uploading=false;const msg=s=>$('status').textContent=s;function controls(){ $('start').disabled=!stream||busy||!!blob;$('stop').disabled=!busy;$('preview').disabled=busy||opening||!!blob||uploading;$('mode').disabled=busy||opening||!!stream||uploading;$('delay').disabled=busy;$('release').disabled=busy||opening||!stream;$('cloud').disabled=uploading||textUploading||!blob||cloudDone;$('transcribe').disabled=busy;$('lang').disabled=busy;$('cloudText').disabled=busy||uploading||textUploading;$('again').disabled=uploading||textUploading;$('discard').disabled=uploading||textUploading; }function release(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('live').srcObject=null;controls()}function reset(){stopSpeech();speechEpoch++;$('transcript').value="";$('interim').textContent="";$('textStatus').textContent="";$('speechStatus').textContent="Optional / 可选";cloudDone=false;session=null;$('progress').hidden=true;$('progress').value=0;$('cloudstatus').textContent='';$('driveLink').hidden=true;if(url)URL.revokeObjectURL(url);url=null;blob=null;saved=false;$('playvideo').removeAttribute('src');$('playaudio').removeAttribute('src');$('result').hidden=true;controls()}$('mode').onchange=()=>{if(blob){if(!saved&&!confirm('Discard unsaved recording? / 丢弃未保存录制？')){$('mode').value=recordMode;return}reset();$('clock').textContent='00:00';msg('Enable devices / 开启设备')}};$('preview').onclick=async()=>{release();opening=true;controls();try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Browser does not support recording in this context. Use Chrome or Edge on HTTPS or a local file.');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:$('mode').value==='video'?{width:{ideal:1280},height:{ideal:720}}:false});$('live').hidden=$('mode').value==='audio';$('live').srcObject=stream;msg('Devices ready / 设备已就绪');controls()}catch(e){msg(e.name+': '+e.message+'\nCheck browser and Windows device permissions.')}finally{opening=false;controls()}};$('release').onclick=release;function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function begin(){try{recordMode=$('mode').value;parts=[];const opts=recordMode==='video'?{videoBitsPerSecond:1000000,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000};rec=new MediaRecorder(stream,opts);rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onerror=e=>{stopSpeech();msg('Recording error: '+(e.error?.message||'unknown'));clearInterval(timer);busy=false;release()};rec.onstop=()=>{stopSpeech();clearInterval(timer);busy=false;blob=new Blob(parts,{type:rec.mimeType||parts[0]?.type});parts=[];release();url=URL.createObjectURL(blob);const v=$('playvideo'),a=$('playaudio');v.hidden=recordMode!=='video';a.hidden=recordMode!=='audio';(recordMode==='video'?v:a).src=url;$('size').textContent=(blob.size/1048576).toFixed(2)+' MB';$('result').hidden=false;msg('Recording finished. Review and save locally. / 录制完成，请回放并保存。');controls()};rec.start(1000);startSpeech();started=performance.now();$('clock').textContent='00:00';timer=setInterval(()=>$('clock').textContent=format(Math.floor((performance.now()-started)/1000)),200);msg('Recording / 正在录制')}catch(e){busy=false;release();msg(e.message)}}$('start').onclick=()=>{busy=true;controls();let n=Number($('delay').value);if(!n){begin();return}$('clock').textContent=n;msg('Get ready / 准备');timer=setInterval(()=>{if(--n<=0){clearInterval(timer);begin()}else $('clock').textContent=n},1000)};$('stop').onclick=()=>{clearInterval(timer);if(rec?.state==='recording'){stopSpeech();rec.stop()}else{busy=false;controls();msg('Countdown cancelled / 已取消倒计时')}};$('save').onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=url;const ext=blob.type.includes('mp4')?(recordMode==='audio'?'m4a':'mp4'):blob.type.includes('ogg')?'ogg':'webm';a.download='Oral_'+recordMode+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;a.click();saved=true;msg('Download requested. Check your Downloads folder. / 请检查下载文件夹。')};$('again').onclick=()=>{if(saved||confirm('Discard unsaved recording and start again? / 丢弃未保存的录制并重来？')){reset();$('clock').textContent='00:00';msg('Choose a mode and enable devices. / 请选择模式并开启设备。')}};$('discard').onclick=()=>{if(confirm('Discard this recording? / 丢弃本次录制？'))reset()};window.addEventListener('beforeunload',e=>{if(busy||uploading||textUploading||(blob&&!saved)){e.preventDefault();e.returnValue=''}});controls();
let session=null,tokenClient=null,accessToken='',tokenUntil=0;
const CLIENT='1081380645262-mr6tnpcgijmmfru34huei6dm9sdr9qem.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.file';
const cs=t=>$('cloudstatus').textContent=t;
function authorize(){return new Promise((resolve,reject)=>{if(!window.google?.accounts?.oauth2){reject(Error('Google sign-in unavailable. Reload the HTTPS page.'));return}tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:SCOPE,login_hint:'sihanmei2026@gmail.com',callback:r=>{if(r.error){reject(Error(r.error));return}if(!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE)){reject(Error('Drive permission not granted'));return}accessToken=r.access_token;tokenUntil=Date.now()+Number(r.expires_in||3600)*1000;resolve()},error_callback:e=>reject(Error(e.type||'Sign-in cancelled'))});tokenClient.requestAccessToken({prompt:'select_account'});})}
function fileName(){const ext=blob.type.includes('mp4')?(recordMode==='audio'?'m4a':'mp4'):blob.type.includes('ogg')?'ogg':'webm';return 'Oral_'+recordMode+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext}
async function req(url,opts){return fetch(url,{...opts,headers:{Authorization:'Bearer '+accessToken,...opts.headers}})}
function offset(r){const m=/bytes=0-(\d+)/.exec(r.headers.get('Range')||'');return m?Number(m[1])+1:0}
async function finish(r){const f=await r.json();if(!f.id)throw Error('Upload response missing file ID');saved=true;cloudDone=true;session=null;$('progress').value=100;cs('Saved to Google Drive / 已保存到云端: '+f.name);$('driveLink').href='https://drive.google.com/open?id='+encodeURIComponent(f.id);$('driveLink').hidden=false;}
$('cloud').onclick=async()=>{if(!blob||uploading||cloudDone||textUploading)return;uploading=true;controls();$('progress').hidden=false;try{if(!accessToken||Date.now()>tokenUntil-60000){cs('Choose the dedicated Planner account / 请选择Planner专用账号');await authorize()}if(session){const r=await req(session,{method:'PUT',headers:{'Content-Range':'bytes */'+blob.size},body:new Blob([])});if(r.ok){await finish(r);return}if(r.status===308)sessionOffset=offset(r);else if(r.status===404||r.status===410){session=null}else throw Error('Resume check HTTP '+r.status)}if(!session){const r=await req('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size',{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Content-Type':blob.type||'application/octet-stream','X-Upload-Content-Length':String(blob.size)},body:JSON.stringify({name:fileName(),mimeType:blob.type||'application/octet-stream'})});if(!r.ok)throw Error('Start upload HTTP '+r.status);session=r.headers.get('Location');if(!session)throw Error('Upload session URL unavailable');sessionOffset=0}while(sessionOffset<blob.size){const end=Math.min(sessionOffset+4*1024*1024,blob.size);const r=await req(session,{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream','Content-Range':`bytes ${sessionOffset}-${end-1}/${blob.size}`},body:blob.slice(sessionOffset,end)});if(r.ok){await finish(r);return}if(r.status!==308)throw Error('Upload HTTP '+r.status);const next=offset(r);if(next<=sessionOffset)throw Error('Upload did not advance; retry');sessionOffset=next;$('progress').value=100*sessionOffset/blob.size;cs('Uploading / 上传中 '+Math.round($('progress').value)+'%')}throw Error('Upload confirmation missing')}catch(e){if(String(e.message).includes('401'))accessToken='';cs(e.message+' — Click Save to Google Drive to retry / 点击云端保存重试。 Keep this tab open. / 请勿关闭页面。')}finally{uploading=false;controls()}};
let sessionOffset=0;
let speech=null, speechWanted=false, speechRetries=0, speechEpoch=0;
function startSpeech(){if(!$('transcribe').checked)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='Speech recognition unavailable; recording continues.';return}speechWanted=true;speechRetries=0;const epoch=++speechEpoch;function launch(){if(!speechWanted||epoch!==speechEpoch)return;try{const r=new SR();speech=r;r.lang=$('lang').value;r.continuous=true;r.interimResults=true;r.onstart=()=>{$('speechStatus').textContent='Listening / 正在识别'};r.onresult=e=>{if(epoch!==speechEpoch)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){$('transcript').value+=($('transcript').value?' ':'')+t;speechRetries=0}else interim+=t}$('interim').textContent=interim};r.onerror=e=>{if(epoch!==speechEpoch)return;$('speechStatus').textContent='Recognition: '+e.error+'; recording continues.';if(!['no-speech','aborted'].includes(e.error))speechWanted=false};r.onend=()=>{if(epoch!==speechEpoch)return;$('interim').textContent='';if(speechWanted&&speechRetries++<5)setTimeout(launch,400);else if(speechWanted){speechWanted=false;$('speechStatus').textContent='Recognition paused; recording continues.'}};r.start()}catch(e){speechWanted=false;$('speechStatus').textContent=e.message+'; recording continues.'}}launch()}
function stopSpeech(){speechWanted=false;if(speech){try{speech.stop()}catch(e){}speech=null}if($('transcribe').checked)$('speechStatus').textContent='Stopped / 已停止；请检查文字准确性。'}
function transcriptName(){return 'Oral_transcript_'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt'}
$('copyText').onclick=async()=>{try{await navigator.clipboard.writeText($('transcript').value);$('textStatus').textContent='Copied / 已复制'}catch(e){$('transcript').select();$('textStatus').textContent='Press Ctrl+C / 请按 Ctrl+C'}};
$('saveText').onclick=()=>{const u=URL.createObjectURL(new Blob([$('transcript').value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=transcriptName();a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('cloudText').onclick=async()=>{if(textUploading||uploading||busy||!$('transcript').value.trim())return;textUploading=true;controls();try{if(!accessToken||Date.now()>tokenUntil-60000)await authorize();const boundary='oral_'+crypto.randomUUID();const f=new Blob(['--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:transcriptName(),mimeType:'text/plain'})+'\r\n--'+boundary+'\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n',$('transcript').value,'\r\n--'+boundary+'--\r\n']);const r=await req('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:f});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();$('textStatus').textContent='Saved / 已保存: '+data.name}catch(e){$('textStatus').textContent='Save failed / 保存失败: '+e.message}finally{textUploading=false;controls()}};
