<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recording Studio — Device Test</title><style>body{font:16px system-ui;background:#f1f5f9;color:#18304a;margin:0}main{max-width:760px;margin:30px auto;padding:24px;background:white;border-radius:16px}video{width:100%;max-height:380px;background:#172331;border-radius:12px}button,select{font:inherit;padding:10px 15px;margin:5px;border:1px solid #b7c9dc;border-radius:8px;background:white;color:inherit}button:disabled{opacity:.45}#start{background:#2869a0;color:white}#clock{font-size:38px;text-align:center;font-variant-numeric:tabular-nums}#status{white-space:pre-wrap}audio{width:100%}label{display:inline-block;margin:8px}</style><main><h1>Oral Recording Studio</h1><p>Recording Studio v2 · Local only / 仅本地保存</p><label>Mode / 模式 <select id="mode"><option value="video">Video / 录像</option><option value="audio">Audio / 录音</option></select></label><label>Preparation / 准备 <select id="delay"><option>0</option><option>5</option><option selected>10</option><option>15</option><option>30</option></select> s</label><button id="preview">Enable devices / 开启设备</button><video id="live" autoplay muted playsinline></video><div id="clock">00:00</div><button id="start" disabled>Start / 开始</button><button id="stop" disabled>Stop / 停止</button><button id="release">Release devices / 关闭设备</button><p id="status" role="status">Choose a mode and enable devices.</p><section id="result" hidden><h2>Review / 回放</h2><video id="playvideo" controls hidden></video><audio id="playaudio" controls hidden></audio><p id="size"></p><button id="save">Save file / 保存文件</button><button id="again">Record again / 重新录制</button><button id="discard">Discard / 丢弃</button></section></main><script>
const $=id=>document.getElementById(id);let stream,rec,blob,url,timer,started,parts=[],busy=false,recordMode,saved=false,opening=false;const msg=s=>$('status').textContent=s;function controls(){ $('start').disabled=!stream||busy||!!blob;$('stop').disabled=!busy;$('preview').disabled=busy||opening||!!blob;$('mode').disabled=busy||opening||!!stream||!!blob;$('delay').disabled=busy;$('release').disabled=busy||opening||!stream; }function release(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('live').srcObject=null;controls()}function reset(){if(url)URL.revokeObjectURL(url);url=null;blob=null;saved=false;$('playvideo').removeAttribute('src');$('playaudio').removeAttribute('src');$('result').hidden=true;controls()}$('preview').onclick=async()=>{release();opening=true;controls();try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Browser does not support recording in this context. Use Chrome or Edge on HTTPS or a local file.');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:$('mode').value==='video'?{width:{ideal:1280},height:{ideal:720}}:false});$('live').hidden=$('mode').value==='audio';$('live').srcObject=stream;msg('Devices ready / 设备已就绪');controls()}catch(e){msg(e.name+': '+e.message+'\nCheck browser and Windows device permissions.')}finally{opening=false;controls()}};$('release').onclick=release;function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function begin(){try{recordMode=$('mode').value;parts=[];const opts=recordMode==='video'?{videoBitsPerSecond:1000000,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000};rec=new MediaRecorder(stream,opts);rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onerror=e=>{msg('Recording error: '+(e.error?.message||'unknown'));clearInterval(timer);busy=false;release()};rec.onstop=()=>{clearInterval(timer);busy=false;blob=new Blob(parts,{type:rec.mimeType||parts[0]?.type});parts=[];release();url=URL.createObjectURL(blob);const v=$('playvideo'),a=$('playaudio');v.hidden=recordMode!=='video';a.hidden=recordMode!=='audio';(recordMode==='video'?v:a).src=url;$('size').textContent=(blob.size/1048576).toFixed(2)+' MB';$('result').hidden=false;msg('Recording finished. Review and save locally. / 录制完成，请回放并保存。');controls()};rec.start(1000);started=performance.now();$('clock').textContent='00:00';timer=setInterval(()=>$('clock').textContent=format(Math.floor((performance.now()-started)/1000)),200);msg('Recording / 正在录制')}catch(e){busy=false;release();msg(e.message)}}$('start').onclick=()=>{busy=true;controls();let n=Number($('delay').value);if(!n){begin();return}$('clock').textContent=n;msg('Get ready / 准备');timer=setInterval(()=>{if(--n<=0){clearInterval(timer);begin()}else $('clock').textContent=n},1000)};$('stop').onclick=()=>{clearInterval(timer);if(rec?.state==='recording')rec.stop();else{busy=false;controls();msg('Countdown cancelled / 已取消倒计时')}};$('save').onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=url;const ext=blob.type.includes('mp4')?(recordMode==='audio'?'m4a':'mp4'):blob.type.includes('ogg')?'ogg':'webm';a.download='Oral_'+recordMode+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;a.click();saved=true;msg('Download requested. Check your Downloads folder. / 请检查下载文件夹。')};$('again').onclick=()=>{if(saved||confirm('Discard unsaved recording and start again? / 丢弃未保存的录制并重来？')){reset();$('clock').textContent='00:00';msg('Choose a mode and enable devices. / 请选择模式并开启设备。')}};$('discard').onclick=()=>{if(confirm('Discard this recording? / 丢弃本次录制？'))reset()};window.addEventListener('beforeunload',e=>{if(busy||(blob&&!saved)){e.preventDefault();e.returnValue=''}});controls();</script></html>
